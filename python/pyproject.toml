[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amber-arrow"
version = "2.0.0"
description = "Streaming Apache Arrow and Arrow Flight over the Amber columnar time-series engine"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "the Amber authors" }]
keywords = ["amber", "arrow", "flight", "grpc", "columnar", "zero-copy", "time-series"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Database :: Database Engines/Servers",
]
# pyarrow is the ONLY hard dependency, and it is hard because every public entry
# point returns a pyarrow object. `amber` (python-amber) is NOT required: the
# amberd client and the --remote Flight backend speak a socket protocol and need
# no engine in this process at all.
dependencies = ["pyarrow>=12"]

[project.optional-dependencies]
embedded = ["amber>=2.0.0"]           # the in-process, zero-copy backend
pandas   = ["pandas>=1.3"]
dev      = ["pytest>=7", "amber>=2.0.0", "pandas>=1.3"]

[project.scripts]
amber-flight = "amber_flight.__main__:main"

[project.urls]
Homepage = "https://github.com/BonucciAndrea/amber-arrow"
Engine   = "https://github.com/BonucciAndrea/amber"

[tool.setuptools.packages.find]
where = ["."]
include = ["amber_arrow*", "amber_flight*"]

[tool.setuptools.package-data]
amber_arrow = ["libamber_arrow.so", "libamber_arrow.dylib"]
